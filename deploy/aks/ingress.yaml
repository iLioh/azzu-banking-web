# Referencia no incluida en kustomization. No aplicar hasta definir el edge definitivo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azzu-banking-web
  namespace: azzu-web-dev
  annotations:
    kubernetes.io/ingress.class: webapprouting.kubernetes.azure.com
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - banca.azzu.tech
      secretName: azzu-banking-web-tls
  rules:
    - host: banca.azzu.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: azzu-banking-web
                port:
                  name: http
